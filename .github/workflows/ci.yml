name: CI

# The app is static files, so "does it work" cannot be answered by a build
# succeeding. The gate is a real browser driving the real page.
#
# Three jobs, and the difference between them matters:
#   smoke      — the original 31-check deploy gate for the frozen vanilla reference
#   behaviour  — the GATE: the behaviour suite against the frozen vanilla
#                reference, which is the proven app until the user reviews and
#                confirms the React rebuild
#   next       — the Rebuild's suite in report mode. Kept green beside the gate,
#                so "green on the reference, red on the new app" names a
#                regression instead of being invisible.
#
# At cutover the last two flip: the new app becomes the gate and the reference
# retires with its vanilla files.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke test in a real browser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install the test harness
        run: npm ci

      - name: Install chromium
        run: npx playwright install --with-deps chromium

      - name: Syntax check
        run: npm run check

      - name: Smoke test
        run: npm test

      - name: Upload what failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-failure
          path: tests/.artifacts/
          if-no-files-found: ignore

  behaviour:
    name: Behaviour suite against the frozen vanilla reference (GATE)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install chromium
        run: npx playwright install --with-deps chromium

      # The gate is the PROVEN app. The user has not yet reviewed the React
      # rebuild, so the frozen vanilla reference is what gates the build and the
      # new app is reported beside it. Flipping this before sign-off would
      # remove the "green on the reference, red on the new app = a named
      # regression" signal the dual-target suite exists to produce.
      - name: Behaviour suite
        run: npm run behaviour

      - name: Upload the report and any failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: behaviour-reference
          path: tests/.artifacts/
          if-no-files-found: ignore

  next:
    name: Behaviour suite against the React app (report until sign-off)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install chromium
        run: npx playwright install --with-deps chromium

      # Report mode until the user confirms the rebuild: a failure here is a
      # finding to act on, not a blocked release. Flip the two jobs over at
      # cutover, when the new app becomes the app.
      - name: Behaviour suite (new app)
        run: npm run behaviour:next

      - name: Upload the new app's report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: behaviour-next
          path: tests/.artifacts/
          if-no-files-found: ignore
