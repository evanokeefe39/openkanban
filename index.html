<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230a0608'/%3E%3Crect x='2' y='3' width='3' height='10' fill='%23f9ffd0'/%3E%3Crect x='6.5' y='3' width='3' height='7' fill='%23f59e0b'/%3E%3Crect x='11' y='3' width='3' height='4' fill='%236366f1'/%3E%3C/svg%3E"
    />
    <title>OpenKanban</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <span class="brand">OPENKANBAN</span>
        <h1 class="board-name" id="board-name">&mdash;</h1>
        <p class="counters" id="counters"></p>
        <span class="spacer"></span>
        <span class="lamp" id="storage-lamp" title="storage status">
          <span class="lamp-dot" aria-hidden="true"></span>
          <span id="storage-lamp-text">READY</span>
        </span>
        <button class="btn" id="btn-export" type="button">EXPORT</button>
        <button class="btn" id="btn-import" type="button">IMPORT</button>
        <button class="btn" id="btn-settings" type="button">SETTINGS</button>
      </header>

      <section class="filters" aria-label="Filters">
        <label class="search">
          <span class="visually-hidden">Search cards</span>
          <input
            class="input"
            type="search"
            id="filter-query"
            placeholder="SEARCH TITLE / NOTES / LABEL"
            autocomplete="off"
            spellcheck="false"
          />
        </label>
        <div class="label-filters" id="label-filters"></div>
        <button class="btn toggle" id="filter-blocked" type="button" aria-pressed="false">
          BLOCKED ONLY
        </button>
        <button class="btn" id="filter-clear" type="button">CLEAR</button>
        <span class="filter-spacer"></span>
        <span class="prio-legend" id="prio-legend" title="Card priority — the bar on the top edge of a card">
          <span class="prio-legend-label">PRIORITY</span>
          <span class="prio-key" data-prio="1"><i></i>P0</span>
          <span class="prio-key" data-prio="2"><i></i>P1</span>
          <span class="prio-key" data-prio="3"><i></i>P2</span>
          <span class="prio-key" data-prio="0"><i></i>NONE</span>
        </span>
      </section>

      <main class="board" id="board" aria-label="Kanban board"></main>
    </div>

    <dialog class="drawer" id="card-dialog" aria-labelledby="card-kicker">
      <div class="drawer-head">
        <span class="drawer-kicker" id="card-kicker">CARD</span>
        <button class="btn" id="card-close" type="button" aria-label="Close card">CLOSE</button>
      </div>
      <div class="drawer-body">
        <label class="field">
          <span class="field-label">TITLE</span>
          <input class="input" id="card-title" type="text" spellcheck="false" />
        </label>
        <label class="field">
          <span class="field-label">NOTES</span>
          <textarea class="input" id="card-notes" rows="5" spellcheck="false"></textarea>
        </label>
        <div class="field">
          <span class="field-label">PRIORITY</span>
          <div class="seg" id="card-priority" role="group" aria-label="Priority"></div>
        </div>
        <div class="field">
          <span class="field-label">DUE</span>
          <div class="row">
            <input class="input" id="card-due" type="date" />
            <button class="btn" id="card-due-clear" type="button">CLEAR</button>
          </div>
        </div>
        <div class="field">
          <span class="field-label">LABELS</span>
          <div class="chips" id="card-labels"></div>
          <div class="row">
            <input
              class="input"
              id="card-label-input"
              list="label-options"
              placeholder="ADD LABEL"
              autocomplete="off"
              spellcheck="false"
            />
            <datalist id="label-options"></datalist>
            <button class="btn" id="card-label-add" type="button">ADD</button>
          </div>
        </div>
        <div class="field">
          <span class="field-label" id="card-blockers-label">BLOCKED BY</span>
          <div class="chips" id="card-blockers"></div>
          <input
            class="input"
            id="card-blocker-input"
            placeholder="ADD BLOCKER — TYPE TO FILTER"
            autocomplete="off"
            spellcheck="false"
          />
          <div class="picker" id="card-blocker-picker"></div>
        </div>
        <div class="field">
          <span class="field-label">BLOCKS</span>
          <div class="chips" id="card-blocks"></div>
        </div>
        <div class="field">
          <span class="field-label">MOVE TO</span>
          <div class="seg" id="card-move" role="group" aria-label="Move to column"></div>
        </div>
        <p class="meta-line" id="card-meta"></p>
      </div>
      <div class="drawer-foot">
        <button class="btn danger" id="card-delete" type="button">DELETE CARD</button>
      </div>
    </dialog>

    <dialog class="drawer" id="settings-dialog" aria-labelledby="settings-kicker">
      <div class="drawer-head">
        <span class="drawer-kicker" id="settings-kicker">SETTINGS</span>
        <button class="btn" id="settings-close" type="button" aria-label="Close settings">
          CLOSE
        </button>
      </div>
      <div class="drawer-body">
        <label class="field">
          <span class="field-label">BOARD NAME</span>
          <input class="input" id="settings-name" type="text" spellcheck="false" />
        </label>
        <div class="field">
          <span class="field-label">LIFECYCLE STATES</span>
          <div class="col-rows" id="settings-columns"></div>
          <button class="btn" id="settings-add-column" type="button">+ ADD COLUMN</button>
          <p class="hint">
            GATE — a blocked card warns before entering this column. DONE — cards here count as
            complete when resolving blockers.
          </p>
        </div>
        <div class="field">
          <span class="field-label">STORAGE</span>
          <p class="hint" id="settings-storage"></p>
          <div class="row">
            <button class="btn" id="settings-export" type="button">EXPORT JSON</button>
            <button class="btn" id="settings-import" type="button">IMPORT JSON</button>
          </div>
        </div>
      </div>
    </dialog>

    <dialog class="modal" id="confirm-dialog" aria-labelledby="confirm-title">
      <h2 class="modal-title" id="confirm-title"></h2>
      <div class="modal-text" id="confirm-text"></div>
      <div class="modal-actions">
        <button class="btn" id="confirm-cancel" type="button">CANCEL</button>
        <button class="btn primary" id="confirm-ok" type="button">CONFIRM</button>
      </div>
    </dialog>

    <input type="file" id="import-input" accept=".json,application/json" hidden />
    <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
    <script src="app.js" defer></script>
  </body>
</html>
